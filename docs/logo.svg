<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- Branch + merge icon -->
  <g transform="translate(30, 80)">
    <!-- commit nodes -->
    <circle cx="0" cy="0" r="10" fill="url(#g)"/>
    <circle cx="0" cy="40" r="10" fill="url(#g)"/>
    <circle cx="50" cy="40" r="10" fill="url(#g2)"/>
    <circle cx="0" cy="80" r="10" fill="url(#g)"/>

    <!-- vertical line -->
    <line x1="0" y1="10" x2="0" y2="30" stroke="url(#g)" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="50" x2="0" y2="70" stroke="url(#g)" stroke-width="4" stroke-linecap="round"/>

    <!-- branch off -->
    <path d="M0 40 C0 40, 25 40, 40 40" stroke="url(#g2)" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Text -->
  <text x="110" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="#e2e8f0" letter-spacing="-0.5">Git</text>
  <text x="192" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="url(#g)" letter-spacing="-0.5">Craque</text>

  <!-- Tagline -->
  <text x="110" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#94a3b8" font-weight="500" letter-spacing="0.3">Cliente Git de desktop — sem Electron</text>
</svg>
